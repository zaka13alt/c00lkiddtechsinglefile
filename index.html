    allowfullscreen 
    allowpaymentrequest>
  </iframe>
  <script>
    const urls = [
      "https://c00lkiddtech.live/?boot=1",
      "https://c00lcars.media",
      "https://c00lkiddtech.is.the.best.english117.dpdns.org/",
      "https://c00lkiddtech-is.nice.zaka.qzz.io/"
    ];
    const randomIndex = Math.floor(Math.random() * urls.length);
    document.getElementById("random-iframe").src = urls[randomIndex];

</body>
</html>
